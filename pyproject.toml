[project]
name = "tradier-0dte-collector"
version = "0.1.0"
description = "Research-grade 1-minute 0DTE options data collector for Tradier (SPY/QQQ/IWM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
# PTH105: os.replace is used deliberately for atomic file replacement; the
# explicit call documents the atomicity guarantee and is spied on in tests.
ignore = ["B008", "PTH105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:tradier_collector.*"]

[tool.coverage.run]
source = ["tradier_collector", "config", "scheduler", "qa_report", "watchdog", "backup", "validate_dataset"]
omit = ["tests/*", ".venv/*"]
